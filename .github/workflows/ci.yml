name: CI

on:
  pull_request:
    branches: [develop, 'release/*']
  push:
    branches: [develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Python 3.13 + API deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/api
          uv venv --python 3.13
          git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          uv pip install -e ".[dev]"
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck core
        run: pnpm -F @eguru/core typecheck
      - name: Core unit tests
        run: pnpm -F @eguru/core test
      - name: API tests (Python 3.13)
        run: cd apps/api && DEV_USER_EMAIL=dev@catalog.mx ENVIRONMENT=local .venv/bin/pytest -q
      - name: Lint
        run: pnpm -r run lint --if-present 2>/dev/null || true
        continue-on-error: true
