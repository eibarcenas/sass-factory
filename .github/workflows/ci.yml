name: CI

on:
  pull_request:
    branches: [develop, 'release/*']
  push:
    branches: [develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Python 3.13 + backend deps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          for service in catalog-api identity-api demos-api prospects-api notifications-webhook; do
            (cd "apps/${service}" && uv venv --python 3.13 && uv pip install -e ".[dev]")
          done
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck core
        run: pnpm -F @eguru/core typecheck
      - name: Core unit tests
        run: pnpm -F @eguru/core test
      - name: Backend tests (Python 3.13)
        run: |
          for service in catalog-api identity-api demos-api prospects-api notifications-webhook; do
            (cd "apps/${service}" && DEV_USER_EMAIL=dev@catalog.mx ENVIRONMENT=local .venv/bin/pytest -q)
          done
      - name: Lint
        run: pnpm -r run lint --if-present 2>/dev/null || true
        continue-on-error: true
