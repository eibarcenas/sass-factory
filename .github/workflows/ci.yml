name: CI

on:
  pull_request:
    branches: [develop, 'release/*']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'
  push:
    branches: [develop]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  js:
    name: JS checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck core
        run: pnpm -F @eguru/core typecheck
      - name: Core unit tests
        run: pnpm -F @eguru/core test
      - name: Lint
        run: pnpm -r --if-present run lint

  backend:
    name: Backend tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - catalog-api
          - identity-api
          - demos-api
          - prospects-api
          - notifications-webhook
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Backend tests (Python 3.13)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEV_USER_EMAIL: dev@catalog.mx
          ENVIRONMENT: local
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          trap 'git config --global --unset-all url."https://x-access-token:${GH_PAT}@github.com/".insteadOf || true' EXIT
          cd "apps/${{ matrix.service }}"
          uv venv --python 3.13
          uv pip install -e ".[dev]"
          .venv/bin/pytest -q
