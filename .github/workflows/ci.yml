name: CI

on:
  pull_request:
    branches: [develop, 'release/*']
  push:
    branches: [develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: pip3 install fastapi uvicorn pytest httpx

      - name: Typecheck core
        run: pnpm -F @catalog-mx/core typecheck

      - name: Core unit tests
        run: pnpm -F @catalog-mx/core test

      - name: API tests (pytest)
        run: cd apps/api && python3 -m pytest tests/ -q

      - name: Lint
        run: pnpm lint --if-present
        continue-on-error: true
