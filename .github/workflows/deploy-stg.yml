name: Deploy — Stg (ei-catalog-stg)

on:
  push:
    branches: ['release/**']
    paths:
      - 'apps/admin-fe/**'
      - 'apps/catalog-api/**'
      - 'apps/identity-api/**'
      - 'apps/demos-api/**'
      - 'apps/prospects-api/**'
      - 'apps/notifications-webhook/**'
      - 'apps/storefront-fe/**'
      - 'apps/landing-fe/**'
      - 'packages/**'
      - '.github/workflows/deploy-stg.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PROJECT: ei-catalog-stg
  REGION: us-central1
  AR_URL: us-central1-docker.pkg.dev/ei-catalog-stg/catalog-mx
  ENV_SUFFIX: stg

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    if: ${{ vars.WIF_PROVIDER_STG != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP — ei-catalog-stg
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_STG }}
          service_account: ${{ vars.DEPLOYER_SA_STG }}

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3

      - name: Deploy API (catalog-mx-catalog-api-stg)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DOCKER_BUILDKIT: "1"
        run: |
          IMAGE="${{ env.AR_URL }}/catalog-mx-catalog-api:${{ github.sha }}"
          docker buildx build \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --secret id=gh_pat,env=GH_PAT \
            -t "$IMAGE" apps/catalog-api/
          gcloud run deploy catalog-mx-catalog-api-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" --region "${{ env.REGION }}" --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_STG }}" \
            --set-env-vars="FIRESTORE_PROJECT_ID=${{ env.PROJECT }},GCS_BUCKET=ei-catalog-images-stg,ENVIRONMENT=staging,FIREBASE_AUTH_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }},STOREFRONT_URL=${{ vars.STOREFRONT_URL }},ADMIN_URL=${{ vars.ADMIN_URL }},SMTP_HOST=${{ vars.SMTP_HOST }},SMTP_PORT=${{ vars.SMTP_PORT }},SMTP_USER=${{ vars.SMTP_USER }},SMTP_FROM=${{ vars.SMTP_FROM }},ADMIN_NOTIFY_EMAIL=${{ vars.ADMIN_NOTIFY_EMAIL }}" \
            --update-secrets="SMTP_PASS=SMTP_PASS:latest" \
            --allow-unauthenticated --quiet

      - name: Deploy Storefront (catalog-mx-storefront-stg)
        run: |
          API_URL=$(gcloud run services describe catalog-mx-catalog-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} --format='value(status.url)')
          ADMIN_URL=$(gcloud run services describe catalog-mx-admin-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} --format='value(status.url)')
          IMAGE="${{ env.AR_URL }}/catalog-mx-storefront:${{ github.sha }}"
          docker buildx build \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg NEXT_PUBLIC_ADMIN_URL="${ADMIN_URL}" \
            --build-arg NEXT_PUBLIC_API_URL="${API_URL}" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ vars.FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_SUPPORT_WHATSAPP="${{ vars.SUPPORT_WHATSAPP }}" \
            -t "$IMAGE" -f apps/storefront-fe/Dockerfile .
          gcloud run deploy catalog-mx-storefront-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" --region "${{ env.REGION }}" --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_STG }}" \
            --set-env-vars="API_URL=${API_URL}" \
            --allow-unauthenticated --quiet

      - name: Deploy Admin (catalog-mx-admin-stg)
        run: |
          API_URL=$(gcloud run services describe catalog-mx-catalog-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} --format='value(status.url)')
          STOREFRONT_URL=$(gcloud run services describe catalog-mx-storefront-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} --format='value(status.url)')
          IMAGE="${{ env.AR_URL }}/catalog-mx-admin:${{ github.sha }}"
          docker buildx build \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg VITE_API_URL="${API_URL}" \
            --build-arg VITE_STOREFRONT_URL="${STOREFRONT_URL}" \
            --build-arg VITE_FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ vars.FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_ADMIN_URL="${{ vars.ADMIN_URL }}" \
            --build-arg VITE_LANDING_URL="${{ vars.LANDING_URL }}" \
            -t "$IMAGE" -f apps/admin-fe/Dockerfile .
          gcloud run deploy catalog-mx-admin-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" --region "${{ env.REGION }}" --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_STG }}" \
            --allow-unauthenticated --quiet

      - name: Deploy Landing (catalog-mx-landing-stg)
        run: |
          ADMIN_URL=$(gcloud run services describe catalog-mx-admin-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} --format='value(status.url)')
          STOREFRONT_URL=$(gcloud run services describe catalog-mx-storefront-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} --format='value(status.url)')
          IMAGE="${{ env.AR_URL }}/catalog-mx-landing:${{ github.sha }}"
          docker buildx build \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg NEXT_PUBLIC_ADMIN_URL="${ADMIN_URL}" \
            --build-arg NEXT_PUBLIC_STOREFRONT_URL="${STOREFRONT_URL}" \
            -t "$IMAGE" -f apps/landing-fe/Dockerfile .
          gcloud run deploy catalog-mx-landing-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" --region "${{ env.REGION }}" --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_STG }}" \
            --allow-unauthenticated --quiet

      - name: Smoke test
        run: |
          API=$(gcloud run services describe catalog-mx-catalog-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} --format='value(status.url)')
          curl -f "${API}/health" && echo "Smoke test passed"

      - name: Print URLs
        run: |
          echo "STG URLs"
          for svc in catalog-mx-catalog-api-stg catalog-mx-storefront-stg catalog-mx-admin-stg catalog-mx-landing-stg; do
            URL=$(gcloud run services describe $svc \
              --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
              --format='value(status.url)' 2>/dev/null)
            echo "  $svc: $URL"
          done
