name: Deploy — Stg (ei-catalog-stg)

on:
  push:
    branches: ['release/**']

env:
  PROJECT: ei-catalog-stg
  REGION: us-central1
  AR_URL: us-central1-docker.pkg.dev/ei-catalog-stg/catalog-mx
  ENV_SUFFIX: stg

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.WIF_PROVIDER_STG != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP — ei-catalog-stg
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_STG }}
          service_account: ${{ vars.DEPLOYER_SA_STG }}

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Deploy API (catalog-mx-api-stg)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DOCKER_BUILDKIT: "1"
        run: |
          IMAGE="${{ env.AR_URL }}/catalog-mx-api:${{ github.sha }}"
          docker build --secret id=gh_pat,env=GH_PAT -t "$IMAGE" apps/api/
          docker push "$IMAGE"
          gcloud run deploy catalog-mx-api-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" --region "${{ env.REGION }}" --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_STG }}" \
            --update-env-vars="FIRESTORE_PROJECT_ID=${{ env.PROJECT }},GCS_BUCKET=ei-catalog-images-stg,ENVIRONMENT=staging" \
            --allow-unauthenticated --quiet

      - name: Deploy Storefront (catalog-mx-storefront-stg)
        run: |
          API_URL=$(gcloud run services describe catalog-mx-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} --format='value(status.url)')
          IMAGE="${{ env.AR_URL }}/catalog-mx-storefront:${{ github.sha }}"
          docker build -t "$IMAGE" -f apps/storefront/Dockerfile .
          docker push "$IMAGE"
          gcloud run deploy catalog-mx-storefront-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" --region "${{ env.REGION }}" --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_STG }}" \
            --update-env-vars="API_URL=${API_URL}" \
            --allow-unauthenticated --quiet

      - name: Deploy Admin (catalog-mx-admin-stg)
        run: |
          IMAGE="${{ env.AR_URL }}/catalog-mx-admin:${{ github.sha }}"
          docker build -t "$IMAGE" -f apps/admin/Dockerfile .
          docker push "$IMAGE"
          gcloud run deploy catalog-mx-admin-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" --region "${{ env.REGION }}" --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_STG }}" \
            --allow-unauthenticated --quiet

      - name: Smoke test
        run: |
          API=$(gcloud run services describe catalog-mx-api-stg \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} --format='value(status.url)')
          curl -f "${API}/health" && echo "✅ Smoke test passed"
