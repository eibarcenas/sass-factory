name: Deploy — Stg (ei-catalog-stg)

on:
  push:
    branches: ['release/**']

env:
  PROJECT: ei-catalog-stg
  REGION: us-central1
  AR_URL: us-central1-docker.pkg.dev/ei-catalog-stg/ei-catalog

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.WIF_PROVIDER_STG != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP — ei-catalog-stg
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_STG }}
          service_account: ${{ vars.DEPLOYER_SA_STG }}

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Deploy all services
        run: |
          for svc in catalog-mx-api catalog-mx-storefront catalog-mx-admin; do
            dir=$(echo $svc | sed 's/catalog-mx-/apps\//')
            IMAGE="${{ env.AR_URL }}/${svc}:${{ github.sha }}"
            docker build -t "$IMAGE" "$dir/"
            docker push "$IMAGE"
            gcloud run deploy "$svc" --image "$IMAGE" \
              --region "${{ env.REGION }}" --project "${{ env.PROJECT }}" \
              --service-account "${{ vars.RUNTIME_SA_STG }}" --quiet
          done

      - name: Smoke test
        run: |
          API=$(gcloud run services describe catalog-mx-api \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          curl -f "${API}/health"
