name: Deploy Dev — admin-fe

on:
  push:
    branches: [develop]
    paths:
      - 'apps/admin-fe/**'
      - 'packages/**'
      - '.firebaserc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'infrastructure/iterraform/admin-fe/**'
      - '.github/workflows/deploy-dev-admin-fe.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    if: ${{ vars.WIF_PROVIDER_DEV != '' }}
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT: ei-catalog-dev
      REGION: us-central1
      AR_URL: us-central1-docker.pkg.dev/ei-catalog-dev/catalog-mx
      ENV_SUFFIX: dev

      SERVICE: admin-fe
      IMAGE_NAME: catalog-mx-admin
      CLOUD_RUN_SERVICE: catalog-mx-admin-dev
      STORES_API_URL: https://catalog-mx-stores-api-dev-q3peeste7q-uc.a.run.app
      IDENTITY_API_URL: https://catalog-mx-identity-api-dev-q3peeste7q-uc.a.run.app
      PROSPECTS_API_URL: https://catalog-mx-prospects-api-dev-q3peeste7q-uc.a.run.app
      STORE_URL: https://catalog-mx-store-dev-q3peeste7q-uc.a.run.app
      ADMIN_URL: https://catalog-mx-admin-dev-q3peeste7q-uc.a.run.app
      LANDING_URL: https://catalog-mx-landing-dev-q3peeste7q-uc.a.run.app

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F admin-fe typecheck
      - name: Validate Firebase project
        run: |
          CONFIG_PROJECT=$(jq -r '.projects.dev // .projects.default' .firebaserc)
          if [ "$CONFIG_PROJECT" != "$PROJECT" ] || [ "${{ vars.FIREBASE_PROJECT_ID }}" != "$PROJECT" ]; then
            echo "::error::Firebase project configuration must match ${PROJECT}"
            exit 1
          fi

      - name: Auth GCP — ei-catalog-dev
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_DEV }}
          service_account: ${{ vars.DEPLOYER_SA_DEV }}

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        run: |
          IMAGE="${AR_URL}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker buildx build \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg VITE_API_URL="${STORES_API_URL}" \
            --build-arg VITE_STORES_API_URL="${STORES_API_URL}" \
            --build-arg VITE_IDENTITY_API_URL="${IDENTITY_API_URL}" \
            --build-arg VITE_PROSPECTS_API_URL="${PROSPECTS_API_URL}" \
            --build-arg VITE_STORE_URL="${STORE_URL}" \
            --build-arg VITE_FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ vars.FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_ADMIN_URL="${ADMIN_URL}" \
            --build-arg VITE_LANDING_URL="${LANDING_URL}" \
            -t "$IMAGE" -f apps/admin-fe/Dockerfile .

      - name: Deploy Cloud Run service
        run: |
          IMAGE="${AR_URL}/${IMAGE_NAME}:${GITHUB_SHA}"
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "$IMAGE" \
            --region "${REGION}" \
            --project "${PROJECT}" \
            --service-account "${{ vars.RUNTIME_SA_DEV }}" \
            --allow-unauthenticated \
            --quiet
