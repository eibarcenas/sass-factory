name: Deploy — Prod (ei-catalog-prod)

on:
  push:
    branches: [production]
    paths:
      - 'apps/admin-fe/**'
      - 'apps/catalog-api/**'
      - 'apps/identity-api/**'
      - 'apps/demos-api/**'
      - 'apps/prospects-api/**'
      - 'apps/notifications-webhook/**'
      - 'apps/storefront-fe/**'
      - 'apps/landing-fe/**'
      - 'packages/**'
      - '.github/workflows/deploy-prod.yml'
  workflow_dispatch:
    inputs:
      promote_to_full:
        description: Promote canary revisions to 100% after deployment
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PROJECT: ei-catalog-prod
  REGION: us-central1
  AR_URL: us-central1-docker.pkg.dev/ei-catalog-prod/catalog-mx
  ENV_SUFFIX: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.WIF_PROVIDER_PROD != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP — ei-catalog-prod
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PROD }}
          service_account: ${{ vars.DEPLOYER_SA_PROD }}

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3

      - name: Build all images
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DOCKER_BUILDKIT: "1"
        run: |
          API_URL=$(gcloud run services describe catalog-mx-catalog-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)' 2>/dev/null || echo "")

          docker buildx build \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --secret id=gh_pat,env=GH_PAT \
            -t "${{ env.AR_URL }}/catalog-mx-catalog-api:${{ github.sha }}" apps/catalog-api/

          docker buildx build \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f apps/storefront-fe/Dockerfile \
            --build-arg NEXT_PUBLIC_ADMIN_URL="${{ vars.ADMIN_URL }}" \
            --build-arg NEXT_PUBLIC_API_URL="${API_URL}" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ vars.FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_SUPPORT_WHATSAPP="${{ vars.SUPPORT_WHATSAPP }}" \
            -t "${{ env.AR_URL }}/catalog-mx-storefront:${{ github.sha }}" .

          docker buildx build \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f apps/admin-fe/Dockerfile \
            --build-arg VITE_API_URL="${API_URL}" \
            --build-arg VITE_STOREFRONT_URL="${{ vars.STOREFRONT_URL }}" \
            --build-arg VITE_FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ vars.FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_ADMIN_URL="${{ vars.ADMIN_URL }}" \
            --build-arg VITE_LANDING_URL="${{ vars.LANDING_URL }}" \
            -t "${{ env.AR_URL }}/catalog-mx-admin:${{ github.sha }}" .

      - name: Deploy API (catalog-mx-catalog-api-prod) — canary
        run: |
          IMAGE="${{ env.AR_URL }}/catalog-mx-catalog-api:${{ github.sha }}"
          gcloud run deploy catalog-mx-catalog-api-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" --region "${{ env.REGION }}" --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_PROD }}" \
            --set-env-vars="FIRESTORE_PROJECT_ID=${{ env.PROJECT }},GCS_BUCKET=ei-catalog-images-prod,ENVIRONMENT=production,FIREBASE_AUTH_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }},STOREFRONT_URL=${{ vars.STOREFRONT_URL }},ADMIN_URL=${{ vars.ADMIN_URL }},SMTP_HOST=${{ vars.SMTP_HOST }},SMTP_PORT=${{ vars.SMTP_PORT }},SMTP_USER=${{ vars.SMTP_USER }},SMTP_FROM=${{ vars.SMTP_FROM }},ADMIN_NOTIFY_EMAIL=${{ vars.ADMIN_NOTIFY_EMAIL }}" \
            --update-secrets="SMTP_PASS=SMTP_PASS:latest" \
            --allow-unauthenticated --tag canary --no-traffic --quiet
          gcloud run services update-traffic catalog-mx-catalog-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} --to-tags canary=10 --quiet
          echo "API canary: 10% traffic"

      - name: Deploy Storefront + Admin — canary
        run: |
          API_URL=$(gcloud run services describe catalog-mx-catalog-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} --format='value(status.url)')
          for svc in storefront admin; do
            IMAGE="${{ env.AR_URL }}/catalog-mx-${svc}:${{ github.sha }}"
            EXTRA=""
            [ "$svc" = "storefront" ] && EXTRA="--update-env-vars=API_URL=${API_URL}"
            gcloud run deploy catalog-mx-${svc}-${{ env.ENV_SUFFIX }} \
              --image "$IMAGE" --region "${{ env.REGION }}" --project "${{ env.PROJECT }}" \
              --service-account "${{ vars.RUNTIME_SA_PROD }}" \
              --allow-unauthenticated --tag canary --no-traffic $EXTRA --quiet
            gcloud run services update-traffic catalog-mx-${svc}-${{ env.ENV_SUFFIX }} \
              --region=${{ env.REGION }} --project=${{ env.PROJECT }} --to-tags canary=10 --quiet
          done

      - name: Smoke test production API
        run: |
          API=$(gcloud run services describe catalog-mx-catalog-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} --format='value(status.url)')
          curl -f "${API}/health" && echo "Production API smoke test passed"

      - name: Promote canaries to 100%
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_to_full }}
        run: |
          gcloud run services update-traffic catalog-mx-catalog-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} --to-latest --quiet
          echo "catalog-mx-catalog-api-prod: 100%"
          for svc in storefront admin; do
            gcloud run services update-traffic catalog-mx-${svc}-${{ env.ENV_SUFFIX }} \
              --region=${{ env.REGION }} --project=${{ env.PROJECT }} --to-latest --quiet
            echo "catalog-mx-${svc}-prod: 100%"
          done
