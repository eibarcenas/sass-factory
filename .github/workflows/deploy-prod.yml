name: Deploy — Prod (ei-catalog-prod)

on:
  push:
    branches: [production]

env:
  PROJECT: ei-catalog-prod
  REGION: us-central1
  AR_URL: us-central1-docker.pkg.dev/ei-catalog-prod/catalog-mx
  ENV_SUFFIX: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.WIF_PROVIDER_PROD != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP — ei-catalog-prod
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PROD }}
          service_account: ${{ vars.DEPLOYER_SA_PROD }}

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push all images
        run: |
          for svc in api storefront admin; do
            IMAGE="${{ env.AR_URL }}/catalog-mx-${svc}:${{ github.sha }}"
            docker build -t "$IMAGE" apps/${svc}/
            docker push "$IMAGE"
            echo "Pushed: $IMAGE"
          done

      - name: Deploy API (catalog-mx-api-prod) — canary
        run: |
          IMAGE="${{ env.AR_URL }}/catalog-mx-api:${{ github.sha }}"
          gcloud run deploy catalog-mx-api-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" --region "${{ env.REGION }}" --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_PROD }}" \
            --update-env-vars="FIRESTORE_PROJECT_ID=${{ env.PROJECT }},GCS_BUCKET=ei-catalog-images-prod,ENVIRONMENT=production" \
            --allow-unauthenticated --tag canary --no-traffic --quiet
          gcloud run services update-traffic catalog-mx-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} --to-tags canary=10 --quiet
          echo "API canary: 10% traffic"

      - name: Deploy Storefront + Admin — canary
        run: |
          API_URL=$(gcloud run services describe catalog-mx-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} --format='value(status.url)')
          for svc in storefront admin; do
            IMAGE="${{ env.AR_URL }}/catalog-mx-${svc}:${{ github.sha }}"
            EXTRA=""
            [ "$svc" = "storefront" ] && EXTRA="--update-env-vars=API_URL=${API_URL}"
            gcloud run deploy catalog-mx-${svc}-${{ env.ENV_SUFFIX }} \
              --image "$IMAGE" --region "${{ env.REGION }}" --project "${{ env.PROJECT }}" \
              --service-account "${{ vars.RUNTIME_SA_PROD }}" \
              --allow-unauthenticated --tag canary --no-traffic $EXTRA --quiet
            gcloud run services update-traffic catalog-mx-${svc}-${{ env.ENV_SUFFIX }} \
              --region=${{ env.REGION }} --project=${{ env.PROJECT }} --to-tags canary=10 --quiet
          done

      - name: Wait 5 min then promote to 100%
        run: |
          echo "Waiting 5 minutes on canary..."
          sleep 300
          for svc in api storefront admin; do
            gcloud run services update-traffic catalog-mx-${svc}-${{ env.ENV_SUFFIX }} \
              --region=${{ env.REGION }} --project=${{ env.PROJECT }} --to-latest --quiet
            echo "✅ catalog-mx-${svc}-prod: 100%"
          done
