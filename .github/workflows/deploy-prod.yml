name: Deploy — Prod (ei-catalog-prod)

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # requires manual approval in GitHub
    if: ${{ vars.WIF_PROVIDER_PROD != '' }}
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT: ei-catalog-prod
      REGION: us-central1
      AR_URL: us-central1-docker.pkg.dev/ei-catalog-prod/ei-catalog

    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP — ei-catalog-prod
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PROD }}
          service_account: ${{ vars.DEPLOYER_SA_PROD }}

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Deploy all services (canary 10% → 100%)
        run: |
          for svc in catalog-mx-api catalog-mx-storefront catalog-mx-admin; do
            dir=$(echo $svc | sed 's/catalog-mx-/apps\//')
            IMAGE="${{ env.AR_URL }}/${svc}:${{ github.sha }}"
            docker build -t "$IMAGE" "$dir/"
            docker push "$IMAGE"
            # Deploy as canary revision
            gcloud run deploy "$svc" --image "$IMAGE" \
              --region "${{ env.REGION }}" --project "${{ env.PROJECT }}" \
              --service-account "${{ vars.RUNTIME_SA_PROD }}" \
              --tag canary --no-traffic --quiet
            # Send 10% traffic to canary
            gcloud run services update-traffic "$svc" \
              --region "${{ env.REGION }}" --project "${{ env.PROJECT }}" \
              --to-tags canary=10 --quiet
          done

      - name: Wait 5 minutes then promote to 100%
        run: |
          sleep 300
          for svc in catalog-mx-api catalog-mx-storefront catalog-mx-admin; do
            gcloud run services update-traffic "$svc" \
              --region "${{ env.REGION }}" --project "${{ env.PROJECT }}" \
              --to-latest --quiet
          done
