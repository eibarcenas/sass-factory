name: Deploy — Dev (ei-catalog-dev)

on:
  push:
    branches: [develop]

env:
  PROJECT: ei-catalog-dev
  REGION: us-central1
  AR_URL: us-central1-docker.pkg.dev/ei-catalog-dev/catalog-mx

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: astral-sh/setup-uv@v5
      - name: Install Python deps
        run: |
          cd apps/api && uv venv --python 3.13
          uv pip install fastapi "uvicorn[standard]" pydantic pydantic-settings \
            google-cloud-firestore google-cloud-storage firebase-admin \
            cachetools slowapi python-dotenv python-multipart pytest httpx
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @catalog-mx/core typecheck
      - run: pnpm -F @catalog-mx/core test
      - run: cd apps/api && DEV_USER_EMAIL=dev@test.com ENVIRONMENT=local .venv/bin/pytest -q

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: ${{ vars.WIF_PROVIDER_DEV != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP — ei-catalog-dev
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_DEV }}
          service_account: ${{ vars.DEPLOYER_SA_DEV }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Deploy API
        run: |
          IMAGE="${{ env.AR_URL }}/catalog-mx-api:${{ github.sha }}"
          docker build -t "$IMAGE" apps/api/
          docker push "$IMAGE"
          gcloud run deploy catalog-mx-api \
            --image "$IMAGE" --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_DEV }}" \
            --update-env-vars="FIRESTORE_PROJECT_ID=${{ env.PROJECT }},GCS_BUCKET=ei-catalog-images-dev,ENVIRONMENT=development" \
            --quiet

      - name: Deploy Storefront
        run: |
          IMAGE="${{ env.AR_URL }}/catalog-mx-storefront:${{ github.sha }}"
          docker build -t "$IMAGE" apps/storefront/
          docker push "$IMAGE"
          gcloud run deploy catalog-mx-storefront \
            --image "$IMAGE" --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_DEV }}" \
            --quiet

      - name: Deploy Admin
        run: |
          IMAGE="${{ env.AR_URL }}/catalog-mx-admin:${{ github.sha }}"
          docker build -t "$IMAGE" apps/admin/
          docker push "$IMAGE"
          gcloud run deploy catalog-mx-admin \
            --image "$IMAGE" --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_DEV }}" \
            --quiet
