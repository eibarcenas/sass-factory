name: Deploy — Dev (ei-catalog-dev)

on:
  push:
    branches: [develop]
    paths:
      - 'apps/admin/**'
      - 'apps/api/**'
      - 'apps/storefront/**'
      - 'apps/landing/**'
      - 'packages/**'
      - '.github/workflows/deploy-dev.yml'

env:
  PROJECT: ei-catalog-dev
  REGION: us-central1
  AR_URL: us-central1-docker.pkg.dev/ei-catalog-dev/catalog-mx
  ENV_SUFFIX: dev
  ADMIN_URL: https://catalog-mx-admin-dev-q3peeste7q-uc.a.run.app
  STOREFRONT_URL: https://catalog-mx-storefront-dev-q3peeste7q-uc.a.run.app
  LANDING_URL: https://catalog-mx-landing-dev-q3peeste7q-uc.a.run.app

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: astral-sh/setup-uv@v5
      - name: Install Python deps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd apps/api
          uv venv --python 3.13
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          uv pip install -e ".[dev]"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @eguru/core typecheck
      - run: pnpm -F admin typecheck
      - run: pnpm -F @catalog-mx/landing typecheck
      - run: pnpm -F @eguru/core test
      - run: pnpm -F admin test
      - name: Run API tests
        run: cd apps/api && .venv/bin/pytest -q
        env:
          DEV_USER_EMAIL: dev@test.local
          ENVIRONMENT: local

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: ${{ vars.WIF_PROVIDER_DEV != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP — ei-catalog-dev
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_DEV }}
          service_account: ${{ vars.DEPLOYER_SA_DEV }}

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Deploy API (catalog-mx-api-dev)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DOCKER_BUILDKIT: "1"
        run: |
          IMAGE="${{ env.AR_URL }}/catalog-mx-api:${{ github.sha }}"
          docker build --secret id=gh_pat,env=GH_PAT -t "$IMAGE" apps/api/
          docker push "$IMAGE"
          gcloud run deploy catalog-mx-api-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_DEV }}" \
            --set-env-vars="FIRESTORE_PROJECT_ID=${{ env.PROJECT }},GCS_BUCKET=ei-catalog-images-dev,ENVIRONMENT=development,FIREBASE_AUTH_PROJECT_ID=catalog-mx-dev,STOREFRONT_URL=${{ env.STOREFRONT_URL }},ADMIN_URL=${{ env.ADMIN_URL }},SMTP_HOST=${{ vars.SMTP_HOST }},SMTP_PORT=${{ vars.SMTP_PORT }},SMTP_USER=${{ vars.SMTP_USER }},SMTP_FROM=${{ vars.SMTP_FROM }},ADMIN_NOTIFY_EMAIL=${{ vars.ADMIN_NOTIFY_EMAIL }}" \
            --update-secrets="SMTP_PASS=SMTP_PASS:latest" \
            --allow-unauthenticated \
            --quiet

      - name: Deploy Storefront (catalog-mx-storefront-dev)
        run: |
          API_URL=$(gcloud run services describe catalog-mx-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          ADMIN_URL=$(gcloud run services describe catalog-mx-admin-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          IMAGE="${{ env.AR_URL }}/catalog-mx-storefront:${{ github.sha }}"
          docker build \
            --build-arg NEXT_PUBLIC_ADMIN_URL="${ADMIN_URL}" \
            --build-arg NEXT_PUBLIC_API_URL="${API_URL}" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ vars.FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_SUPPORT_WHATSAPP="${{ vars.SUPPORT_WHATSAPP }}" \
            -t "$IMAGE" -f apps/storefront/Dockerfile .
          docker push "$IMAGE"
          gcloud run deploy catalog-mx-storefront-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_DEV }}" \
            --set-env-vars="API_URL=${API_URL}" \
            --allow-unauthenticated \
            --quiet

      - name: Deploy Admin (catalog-mx-admin-dev)
        run: |
          API_URL=$(gcloud run services describe catalog-mx-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          STOREFRONT_URL="${{ env.STOREFRONT_URL }}"
          IMAGE="${{ env.AR_URL }}/catalog-mx-admin:${{ github.sha }}"
          docker build \
            --build-arg VITE_API_URL="${API_URL}" \
            --build-arg VITE_STOREFRONT_URL="${STOREFRONT_URL}" \
            --build-arg VITE_FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ vars.FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_ADMIN_URL="${{ env.ADMIN_URL }}" \
            --build-arg VITE_LANDING_URL="${{ env.LANDING_URL }}" \
            -t "$IMAGE" -f apps/admin/Dockerfile .
          docker push "$IMAGE"
          gcloud run deploy catalog-mx-admin-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_DEV }}" \
            --allow-unauthenticated \
            --quiet

      - name: Deploy Landing (catalog-mx-landing-dev)
        run: |
          ADMIN_URL=$(gcloud run services describe catalog-mx-admin-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          STOREFRONT_URL=$(gcloud run services describe catalog-mx-storefront-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          IMAGE="${{ env.AR_URL }}/catalog-mx-landing:${{ github.sha }}"
          docker build \
            --build-arg NEXT_PUBLIC_ADMIN_URL="${ADMIN_URL}" \
            --build-arg NEXT_PUBLIC_STOREFRONT_URL="${STOREFRONT_URL}" \
            -t "$IMAGE" \
            -f apps/landing/Dockerfile .
          docker push "$IMAGE"
          gcloud run deploy catalog-mx-landing-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_DEV }}" \
            --allow-unauthenticated \
            --quiet

      - name: Print URLs
        run: |
          echo "━━━ ei-catalog-dev URLs ━━━"
          for svc in catalog-mx-api-dev catalog-mx-storefront-dev catalog-mx-admin-dev catalog-mx-landing-dev; do
            URL=$(gcloud run services describe $svc \
              --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
              --format='value(status.url)' 2>/dev/null)
            echo "  $svc: $URL"
          done
