name: Deploy — Dev (ei-catalog-dev)

on:
  push:
    branches: [develop]

env:
  PROJECT: ei-catalog-dev
  REGION: us-central1
  AR_URL: us-central1-docker.pkg.dev/ei-catalog-dev/catalog-mx
  ENV_SUFFIX: dev
  ADMIN_URL: https://catalog-mx-admin-dev-q3peeste7q-uc.a.run.app
  STOREFRONT_URL: https://catalog-mx-storefront-dev-q3peeste7q-uc.a.run.app

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: astral-sh/setup-uv@v5
      - name: Install Python deps
        run: |
          cd apps/api && uv venv --python 3.13
          uv pip install fastapi "uvicorn[standard]" pydantic pydantic-settings \
            google-cloud-firestore google-cloud-storage firebase-admin \
            cachetools slowapi python-dotenv python-multipart pytest httpx
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @catalog-mx/core typecheck
      - run: pnpm -F @catalog-mx/core test
      - run: cd apps/api && DEV_USER_EMAIL=dev@test.com ENVIRONMENT=local .venv/bin/pytest -q

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: ${{ vars.WIF_PROVIDER_DEV != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP — ei-catalog-dev
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_DEV }}
          service_account: ${{ vars.DEPLOYER_SA_DEV }}

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Deploy API (catalog-mx-api-dev)
        run: |
          IMAGE="${{ env.AR_URL }}/catalog-mx-api:${{ github.sha }}"
          docker build -t "$IMAGE" apps/api/
          docker push "$IMAGE"
          gcloud run deploy catalog-mx-api-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_DEV }}" \
            --set-env-vars="FIRESTORE_PROJECT_ID=${{ env.PROJECT }},GCS_BUCKET=ei-catalog-images-dev,ENVIRONMENT=development,FIREBASE_AUTH_PROJECT_ID=catalog-mx-dev" \
            --allow-unauthenticated \
            --quiet

      - name: Deploy Storefront (catalog-mx-storefront-dev)
        run: |
          API_URL=$(gcloud run services describe catalog-mx-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          IMAGE="${{ env.AR_URL }}/catalog-mx-storefront:${{ github.sha }}"
          docker build -t "$IMAGE" apps/storefront/
          docker push "$IMAGE"
          gcloud run deploy catalog-mx-storefront-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_DEV }}" \
            --set-env-vars="API_URL=${API_URL}" \
            --allow-unauthenticated \
            --quiet

      - name: Deploy Admin (catalog-mx-admin-dev)
        run: |
          IMAGE="${{ env.AR_URL }}/catalog-mx-admin:${{ github.sha }}"
          docker build -t "$IMAGE" apps/admin/
          docker push "$IMAGE"
          gcloud run deploy catalog-mx-admin-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_DEV }}" \
            --allow-unauthenticated \
            --quiet

      - name: Print URLs
        run: |
          echo "━━━ ei-catalog-dev URLs ━━━"
          for svc in catalog-mx-api-dev catalog-mx-storefront-dev catalog-mx-admin-dev; do
            URL=$(gcloud run services describe $svc \
              --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
              --format='value(status.url)' 2>/dev/null)
            echo "  $svc: $URL"
          done
