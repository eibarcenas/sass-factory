name: Deploy — Dev

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_PROJECT_ID_DEV != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Deploy API
        env:
          IMAGE: ${{ vars.ARTIFACT_REGISTRY_URL }}/catalog-mx-api:${{ github.sha }}
          SERVICE: catalog-mx-api
          REGION: us-central1
        run: |
          docker build -t "$IMAGE" apps/api/
          docker push "$IMAGE"
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "${{ vars.DEPLOYER_SA_EMAIL }}" \
            --quiet

      - name: Deploy storefront
        env:
          IMAGE: ${{ vars.ARTIFACT_REGISTRY_URL }}/catalog-mx-storefront:${{ github.sha }}
          SERVICE: catalog-mx-storefront
          REGION: us-central1
        run: |
          docker build -t "$IMAGE" apps/storefront/
          docker push "$IMAGE"
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --quiet

      - name: Deploy admin
        env:
          IMAGE: ${{ vars.ARTIFACT_REGISTRY_URL }}/catalog-mx-admin:${{ github.sha }}
          SERVICE: catalog-mx-admin
          REGION: us-central1
        run: |
          docker build -t "$IMAGE" apps/admin/
          docker push "$IMAGE"
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --quiet

      - name: Verify deployments
        run: |
          echo "=== Deployed services ==="
          gcloud run services list \
            --project=${{ vars.GCP_PROJECT_ID_DEV }} \
            --region=us-central1 \
            --format="table(name,status.url)"
