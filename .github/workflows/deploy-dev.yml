name: Deploy Dev — all services (manual)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PROJECT: ei-catalog-dev
  REGION: us-central1
  AR_URL: us-central1-docker.pkg.dev/ei-catalog-dev/catalog-mx
  ENV_SUFFIX: dev
  ADMIN_URL: https://catalog-mx-admin-dev-q3peeste7q-uc.a.run.app
  STOREFRONT_URL: https://catalog-mx-storefront-dev-q3peeste7q-uc.a.run.app
  LANDING_URL: https://catalog-mx-landing-dev-q3peeste7q-uc.a.run.app

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: astral-sh/setup-uv@v5
      - name: Install Python backend deps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          trap 'git config --global --unset-all url."https://x-access-token:${GH_PAT}@github.com/".insteadOf || true' EXIT
          for service in catalog-api identity-api demos-api prospects-api notifications-webhook; do
            (cd "apps/${service}" && uv venv --python 3.13 && uv pip install -e ".[dev]")
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @eguru/core typecheck
      - run: pnpm -F admin-fe typecheck
      - run: pnpm -F landing-fe typecheck
      - run: pnpm -F @eguru/core test
      - run: pnpm -F admin-fe test
      - name: Run backend tests
        run: |
          for service in catalog-api identity-api demos-api prospects-api notifications-webhook; do
            (cd "apps/${service}" && .venv/bin/pytest -q)
          done
        env:
          DEV_USER_EMAIL: dev@test.local
          ENVIRONMENT: local

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: dev
    if: ${{ vars.WIF_PROVIDER_DEV != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP — ei-catalog-dev
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_DEV }}
          service_account: ${{ vars.DEPLOYER_SA_DEV }}

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3

      - name: Deploy Backend Services
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DOCKER_BUILDKIT: "1"
        run: |
          for service in catalog-api identity-api demos-api prospects-api notifications-webhook; do
            IMAGE="${{ env.AR_URL }}/catalog-mx-${service}:${{ github.sha }}"
            docker buildx build \
              --push \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --secret id=gh_pat,env=GH_PAT \
              -t "$IMAGE" "apps/${service}/"

            SERVICE_NAME="catalog-mx-${service}-${{ env.ENV_SUFFIX }}"
            ENV_VARS="FIRESTORE_PROJECT_ID=${{ env.PROJECT }},ENVIRONMENT=development,FIREBASE_AUTH_PROJECT_ID=${{ env.PROJECT }},CORS_ALLOWED_ORIGINS=*"
            AUTH_FLAG="--allow-unauthenticated"
            SECRET_FLAGS=()

            if [ "$service" = "catalog-api" ]; then
              ENV_VARS="${ENV_VARS},PUBSUB_PROJECT_ID=${{ env.PROJECT }},GCS_BUCKET=ei-catalog-images-dev"
            elif [ "$service" = "demos-api" ] || [ "$service" = "prospects-api" ]; then
              ENV_VARS="${ENV_VARS},PUBSUB_PROJECT_ID=${{ env.PROJECT }}"
            elif [ "$service" = "notifications-webhook" ]; then
              AUTH_FLAG="--no-allow-unauthenticated"
              ENV_VARS="${ENV_VARS},ADMIN_NOTIFY_EMAIL=${{ vars.ADMIN_NOTIFY_EMAIL }},SMTP_HOST=${{ vars.SMTP_HOST }},SMTP_PORT=${{ vars.SMTP_PORT }},SMTP_USER=${{ vars.SMTP_USER }},SMTP_FROM=${{ vars.SMTP_FROM }},STOREFRONT_URL=${{ env.STOREFRONT_URL }},ADMIN_URL=${{ env.ADMIN_URL }}"
              SECRET_FLAGS=(--update-secrets="SMTP_PASS=SMTP_PASS:latest")
            fi

            gcloud run deploy "$SERVICE_NAME" \
              --image "$IMAGE" \
              --region "${{ env.REGION }}" \
              --project "${{ env.PROJECT }}" \
              --service-account "${{ vars.RUNTIME_SA_DEV }}" \
              --set-env-vars="$ENV_VARS" \
              "${SECRET_FLAGS[@]}" \
              "$AUTH_FLAG" \
              --quiet
          done

      - name: Deploy Storefront (catalog-mx-storefront-dev)
        run: |
          API_URL=$(gcloud run services describe catalog-mx-catalog-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          IDENTITY_API_URL=$(gcloud run services describe catalog-mx-identity-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          DEMOS_API_URL=$(gcloud run services describe catalog-mx-demos-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          PROSPECTS_API_URL=$(gcloud run services describe catalog-mx-prospects-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          ADMIN_URL=$(gcloud run services describe catalog-mx-admin-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          IMAGE="${{ env.AR_URL }}/catalog-mx-storefront:${{ github.sha }}"
          docker buildx build \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg NEXT_PUBLIC_ADMIN_URL="${ADMIN_URL}" \
            --build-arg NEXT_PUBLIC_API_URL="${API_URL}" \
            --build-arg NEXT_PUBLIC_CATALOG_API_URL="${API_URL}" \
            --build-arg NEXT_PUBLIC_IDENTITY_API_URL="${IDENTITY_API_URL}" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ vars.FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_SUPPORT_WHATSAPP="${{ vars.SUPPORT_WHATSAPP }}" \
            -t "$IMAGE" -f apps/storefront-fe/Dockerfile .
          gcloud run deploy catalog-mx-storefront-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_DEV }}" \
            --set-env-vars="API_URL=${API_URL},CATALOG_API_URL=${API_URL},DEMOS_API_URL=${DEMOS_API_URL},PROSPECTS_API_URL=${PROSPECTS_API_URL}" \
            --allow-unauthenticated \
            --quiet

      - name: Deploy Admin (catalog-mx-admin-dev)
        run: |
          CATALOG_API_URL=$(gcloud run services describe catalog-mx-catalog-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          IDENTITY_API_URL=$(gcloud run services describe catalog-mx-identity-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          DEMOS_API_URL=$(gcloud run services describe catalog-mx-demos-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          PROSPECTS_API_URL=$(gcloud run services describe catalog-mx-prospects-api-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          STOREFRONT_URL="${{ env.STOREFRONT_URL }}"
          IMAGE="${{ env.AR_URL }}/catalog-mx-admin:${{ github.sha }}"
          docker buildx build \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg VITE_API_URL="${CATALOG_API_URL}" \
            --build-arg VITE_CATALOG_API_URL="${CATALOG_API_URL}" \
            --build-arg VITE_IDENTITY_API_URL="${IDENTITY_API_URL}" \
            --build-arg VITE_DEMOS_API_URL="${DEMOS_API_URL}" \
            --build-arg VITE_PROSPECTS_API_URL="${PROSPECTS_API_URL}" \
            --build-arg VITE_STOREFRONT_URL="${STOREFRONT_URL}" \
            --build-arg VITE_FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ vars.FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_ADMIN_URL="${{ env.ADMIN_URL }}" \
            --build-arg VITE_LANDING_URL="${{ env.LANDING_URL }}" \
            -t "$IMAGE" -f apps/admin-fe/Dockerfile .
          gcloud run deploy catalog-mx-admin-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_DEV }}" \
            --allow-unauthenticated \
            --quiet

      - name: Deploy Landing (catalog-mx-landing-dev)
        run: |
          ADMIN_URL=$(gcloud run services describe catalog-mx-admin-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          STOREFRONT_URL=$(gcloud run services describe catalog-mx-storefront-${{ env.ENV_SUFFIX }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          IMAGE="${{ env.AR_URL }}/catalog-mx-landing:${{ github.sha }}"
          docker buildx build \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg NEXT_PUBLIC_ADMIN_URL="${ADMIN_URL}" \
            --build-arg NEXT_PUBLIC_STOREFRONT_URL="${STOREFRONT_URL}" \
            -t "$IMAGE" \
            -f apps/landing-fe/Dockerfile .
          gcloud run deploy catalog-mx-landing-${{ env.ENV_SUFFIX }} \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT }}" \
            --service-account "${{ vars.RUNTIME_SA_DEV }}" \
            --allow-unauthenticated \
            --quiet

      - name: Print URLs
        run: |
          echo "━━━ ei-catalog-dev URLs ━━━"
          for svc in catalog-mx-catalog-api-dev catalog-mx-identity-api-dev catalog-mx-demos-api-dev catalog-mx-prospects-api-dev catalog-mx-notifications-webhook-dev catalog-mx-storefront-dev catalog-mx-admin-dev catalog-mx-landing-dev; do
            URL=$(gcloud run services describe $svc \
              --region=${{ env.REGION }} --project=${{ env.PROJECT }} \
              --format='value(status.url)' 2>/dev/null)
            echo "  $svc: $URL"
          done
