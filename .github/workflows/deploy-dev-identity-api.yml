name: Deploy Dev — identity-api

on:
  push:
    branches: [develop]
    paths:
      - 'apps/identity-api/**'
      - 'infrastructure/iterraform/identity-api/**'
      - '.github/workflows/_deploy-dev-service.yml'
      - '.github/workflows/deploy-dev-identity-api.yml'

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-dev-service.yml
    with:
      service: identity-api
      kind: backend
      image_name: catalog-mx-identity-api
      cloud_run_service: catalog-mx-identity-api-dev
    secrets: inherit
