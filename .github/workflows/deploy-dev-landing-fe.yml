name: Deploy Dev — landing-fe

on:
  push:
    branches: [develop]
    paths:
      - 'apps/landing-fe/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'infrastructure/iterraform/landing-fe/**'
      - '.github/workflows/deploy-dev-landing-fe.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    if: ${{ vars.WIF_PROVIDER_DEV != '' }}
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT: ei-catalog-dev
      REGION: us-central1
      AR_URL: us-central1-docker.pkg.dev/ei-catalog-dev/catalog-mx
      ENV_SUFFIX: dev

      SERVICE: landing-fe
      IMAGE_NAME: catalog-mx-landing
      CLOUD_RUN_SERVICE: catalog-mx-landing-dev
      ADMIN_URL: https://catalog-mx-admin-dev-q3peeste7q-uc.a.run.app
      STOREFRONT_URL: https://catalog-mx-storefront-dev-q3peeste7q-uc.a.run.app

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F landing-fe typecheck

      - name: Auth GCP — ei-catalog-dev
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_DEV }}
          service_account: ${{ vars.DEPLOYER_SA_DEV }}

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        run: |
          IMAGE="${AR_URL}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker buildx build \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg NEXT_PUBLIC_ADMIN_URL="${ADMIN_URL}" \
            --build-arg NEXT_PUBLIC_STOREFRONT_URL="${STOREFRONT_URL}" \
            -t "$IMAGE" -f apps/landing-fe/Dockerfile .

      - name: Deploy Cloud Run service
        run: |
          IMAGE="${AR_URL}/${IMAGE_NAME}:${GITHUB_SHA}"
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "$IMAGE" \
            --region "${REGION}" \
            --project "${PROJECT}" \
            --service-account "${{ vars.RUNTIME_SA_DEV }}" \
            --allow-unauthenticated \
            --quiet
