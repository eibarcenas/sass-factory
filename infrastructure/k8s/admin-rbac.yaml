apiVersion: v1
kind: ServiceAccount
metadata:
  name: sass-admin
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sass-admin-role
  namespace: default
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services", "configmaps"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sass-admin-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: sass-admin
  namespace: default
roleRef:
  kind: Role
  name: sass-admin-role
  apiGroup: rbac.authorization.k8s.io
