apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: default
  labels:
    app: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      serviceAccountName: sass-admin
      containers:
      - name: admin
        image: sass-factory/admin:latest
        imagePullPolicy: Never   # image is loaded via `kind load`, not pulled from registry
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        envFrom:
        - secretRef:
            name: admin-env
            optional: true       # missing secret = mock mode (no Firebase)
        volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: dev-configs
          mountPath: /app/.dev-configs
        - name: dev-ports
          mountPath: /app/.dev-ports.json
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: dev-configs
        hostPath:
          path: /home/erick/Desktop/erickbarcenas/sass-factory/.dev-configs
          type: DirectoryOrCreate
      - name: dev-ports
        hostPath:
          path: /home/erick/Desktop/erickbarcenas/sass-factory/.dev-ports.json
          type: FileOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: default
spec:
  type: NodePort
  selector:
    app: admin
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30042
